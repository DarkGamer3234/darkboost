name: Build DarkBoost

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build DarkBoost mod
        run: gradle build

      - name: Install pack tools
        run: sudo apt-get update && sudo apt-get install -y jq zip

      - name: Assemble Minecraft 26.3 performance pack
        run: bash scripts/build-pack.sh

      - name: Upload DarkBoost mod and performance pack
        uses: actions/upload-artifact@v4
        with:
          name: DarkBoost-26.3-Fabric
          path: |
            build/libs/*.jar
            dist/*.zip
